name: Publish image

# Called by the Release workflow, never triggered on its own. The caller picks
# the tag, and this file owns everything after that: the AWS session, the ECR
# login, and the two builds.
#
# Every caller runs on push to main, so the tree this builds has been reviewed
# and merged. That is the whole reason the CI workflow holds no credentials and
# pushes nothing: it builds the tree a pull request author wrote, which nobody
# has reviewed yet.
#
# Actions cache write access is decided by the trigger of the calling run, not
# by this file. The comment at the top of release.yaml explains which triggers
# may write a default-branch cache.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag for the app image. The migrate image adds a -migrate suffix.
        required: true
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract metadata for image
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_LEARNER_REPOSITORY }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=learner
          cache-to: type=gha,mode=max,scope=learner,ignore-error=true

      - name: Extract metadata for migrate image
        id: metadata-migrate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_LEARNER_REPOSITORY }}
          tags: |
            type=raw,value=${{ inputs.tag }}-migrate

      - name: Build and push migrate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          platforms: linux/arm64
          tags: ${{ steps.metadata-migrate.outputs.tags }}
          cache-from: type=gha,scope=learner
          cache-to: type=gha,mode=max,scope=learner,ignore-error=true
