name: Release

# Runs on a push to main rather than on pull_request_target. GitHub restricted
# Actions cache write access by trigger type on 2026-06-26: only push,
# workflow_dispatch, repository_dispatch, delete, registry_package, page_build
# and schedule may write a default-branch cache. pull_request_target resolves to
# the default branch on merge and is therefore read-only, which made every
# release fail at cache export with "failed to reserve cache".
on:
  push:
    branches: [main]

# A ceiling, not a grant. Every job below narrows this to what it needs, so no
# job holds contents: write or id-token: write unless it uses one.
permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      released: ${{ steps.resolve.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so every existing tag is visible to the check below.
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          # Passed through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Squash merges append " (#123)" to the subject and may carry a body.
          # Only the subject is parsed, and only the captured version is used.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ ! "$SUBJECT" =~ ^release:[[:space:]]*v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]+\(#[0-9]+\))?$ ]]; then
            echo "Commit subject is not a release marker:"
            echo "  $SUBJECT"
            exit 1
          fi

          TAG="v${BASH_REMATCH[1]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The tag is pushed only after both images land, so an existing tag
          # means this version was already published. Skip instead of rebuilding.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already released, nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    name: Publish release images
    needs: version
    if: needs.version.outputs.released == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yaml
    with:
      tag: ${{ needs.version.outputs.tag }}

  # A separate job that needs publish-release, so a failed build leaves no tag
  # behind and the run is simply retryable. This is what the previous tag-first
  # ordering got wrong.
  tag:
    name: Tag
    needs: [version, publish-release]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release $TAG"
          git push origin "$TAG"

          echo "Released $TAG with images $TAG and $TAG-migrate."

  # Every other merge to main publishes under its pull request number, so a
  # lower environment can pull a change by the request it came from. A release
  # commit is skipped, because publish-release already publishes that commit
  # under its version tag.
  pull-request:
    name: Resolve pull request
    if: "!startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-24.04-arm
    permissions: {}
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      # No checkout. This job reads the event payload and nothing else.
      - name: Resolve pull request number
        id: resolve
        env:
          # Passed through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # A squash merge appends " (#123)" to the subject. Only the subject is
          # read, and only the captured number is used.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ "$SUBJECT" =~ \(#([0-9]+)\)$ ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Publishing pr-${BASH_REMATCH[1]}-latest."
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "No pull request number in this subject, so nothing is published:"
            echo "  $SUBJECT"
          fi

  publish-merge:
    name: Publish merge images
    needs: pull-request
    if: needs.pull-request.outputs.number != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yaml
    with:
      tag: pr-${{ needs.pull-request.outputs.number }}-latest
