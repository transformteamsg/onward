name: Release

# Runs on a push to main rather than on pull_request_target. GitHub restricted
# Actions cache write access by trigger type on 2026-06-26: only push,
# workflow_dispatch, repository_dispatch, delete, registry_package, page_build
# and schedule may write a default-branch cache. pull_request_target resolves to
# the default branch on merge and is therefore read-only, which made every
# release fail at cache export with "failed to reserve cache".
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      released: ${{ steps.resolve.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so every existing tag is visible to the check below.
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          # Passed through the environment, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Squash merges append " (#123)" to the subject and may carry a body.
          # Only the subject is parsed, and only the captured version is used.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ ! "$SUBJECT" =~ ^release:[[:space:]]*v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]+\(#[0-9]+\))?$ ]]; then
            echo "Commit subject is not a release marker:"
            echo "  $SUBJECT"
            exit 1
          fi

          TAG="v${BASH_REMATCH[1]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The tag is pushed only after both images land, so an existing tag
          # means this version was already published. Skip instead of rebuilding.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already released, nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for image
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_LEARNER_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=learner
          cache-to: type=gha,mode=max,scope=learner,ignore-error=true

      - name: Extract metadata for migrate image
        id: metadata-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_LEARNER_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}-migrate

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          platforms: linux/arm64
          tags: ${{ steps.metadata-migrate.outputs.tags }}
          cache-from: type=gha,scope=learner
          cache-to: type=gha,mode=max,scope=learner,ignore-error=true

      # Last, so a failed build leaves no tag behind and the run is simply
      # retryable. This is what the previous tag-first ordering got wrong.
      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release $TAG"
          git push origin "$TAG"

          echo "Released $TAG with images $TAG and $TAG-migrate."
